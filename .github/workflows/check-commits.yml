name: Check Commit Messages

on:
  pull_request:
    branches:
      - main

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          COMMITS=$(git log origin/main..HEAD --format="%s")
          
          FAILED=0
          
          while IFS= read -r MSG; do
            if echo "$MSG" | grep -qE '^(feat|fix|test|refactor)\(REQ-[0-9]{3}\): .+$'; then
              echo "PASS: $MSG"
            elif echo "$MSG" | grep -qE '^(chore|docs): .+$'; then
              echo "PASS (no REQ ID): $MSG"
            else
              echo "FAIL: $MSG"
              echo "Expected: type(REQ-XXX): description"
              echo "Or for docs/admin: chore: description OR docs: description"
              FAILED=1
            fi
          done <<< "$COMMITS"
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "One or more commit messages do not follow the required format."
            echo "See CONTRIBUTING.md for the full guide."
            exit 1
          fi
