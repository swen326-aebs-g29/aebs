name: Check Commit Messages

on:
  pull_request:
    branches:
      - main

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Get all commits in this PR
          COMMITS=77ec86c70b4ff7f8ee05745cd1183041b1e1c62e chore: add PR template, issue templates and contributing guide e884c445fe8eefe6b56f89c612f1218a80316b96 chore: add commit message template
          
          FAILED=0
          
          while IFS= read -r line; do
            HASH=
            MSG=
            
            # Valid formats:
            # type(REQ-XXX): description
            # chore: description (no REQ ID required)
            if echo "" | grep -qE '^(feat|fix|docs|test|refactor)\(REQ-[0-9]{3}\): .+$'; then
              echo "PASS: "
            elif echo "" | grep -qE '^chore: .+$'; then
              echo "PASS (chore): "
            else
              echo "FAIL: "
              echo "Expected format: type(REQ-XXX): description"
              echo "Valid types: feat, fix, docs, test, refactor"
              echo "Or for admin tasks: chore: description"
              FAILED=1
            fi
          done <<< ""
          
          if [  -eq 1 ]; then
            echo ""
            echo "One or more commit messages do not follow the required format."
            echo "See CONTRIBUTING.md for the full commit message guide."
            exit 1
          fi
